name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: lax-archive/lax-database
          path: data/lax-db

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Measurement is build tooling only; the packaged local renderer has
      # a separate first-party browser/worker path and installs no browser.
      - uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        id: graph-chrome
        with:
          chrome-version: 150.0.7871.124
      - run: echo "GRAPH_CHROME=${{ steps.graph-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .lax-graph-cache
          key: graph-v1-${{ hashFiles('src/graph-layout/**', 'src/sitegen/graph-*.ts', 'assets/site/graph-*', 'assets/site/fonts/*') }}-${{ hashFiles('data/lax-db/*/build-output.json') }}
          restore-keys: graph-v1-
      - run: npm run check

      # Runtime SVG/interaction compatibility; these development browsers
      # never enter the archive assets or the packaged local renderer.
      - run: node node_modules/playwright-core/cli.js install --with-deps firefox webkit
      - run: npm run check -- graph-browser
        env:
          GRAPH_BROWSER: firefox
      - run: npm run check -- graph-browser
        env:
          GRAPH_BROWSER: webkit

      # Compiled papers and reflow bundles come from the archive's capture
      # registry, one file per digest; the cache spares the corpus a
      # re-download per build.
      - uses: actions/cache@v4
        with:
          path: |
            data/papers
            data/bundles
          key: papers-${{ hashFiles('data/lax-db/*/build-output.json') }}
          restore-keys: papers-
      - run: npm run papers:fetch -- --database data/lax-db --papers data/papers --bundles data/bundles
      - uses: actions/cache@v4
        with:
          path: data/references
          key: references-v1-${{ hashFiles('data/lax-db/*/build-output.json') }}
          restore-keys: references-v1-
      - run: npm run references:fetch -- --database data/lax-db --references data/references
      - run: npm run site:build -- --database data/lax-db --papers data/papers --bundles data/bundles --out _site

      - name: Verify deployable output
        run: |
          test -s _site/index.html
          test -s _site/contributing.html
          test -s _site/impressum.html
          test -s _site/privacy.html
          test -s _site/workshop/index.html
          test -s _site/assets/style.css

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: _site
          if-no-files-found: error
